server {
    listen 80;
    server_name localhost;

    # Resolve the application-specific alias through Docker DNS. The unique
    # alias avoids collisions with other Dokploy applications named "backend",
    # while the short TTL survives backend container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://qnu-backend:8001;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Reverse proxy API endpoints to backend
    location /platform/ {
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /health {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
    }

    # Never let SPA fallback make hidden/sensitive paths appear to exist.
    # TLS ACME challenges are handled by Dokploy/Traefik before this container.
    location ~ /\. {
        return 404;
        access_log off;
        log_not_found off;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing fallback: all other requests route to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
