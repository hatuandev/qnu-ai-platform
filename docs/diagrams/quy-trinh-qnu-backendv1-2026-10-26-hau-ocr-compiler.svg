.pill { font-size:11px; fill:#0f766e; }
</style><marker id="qnu-review-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker><marker id="qnu-review-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0284c7"/></marker><marker id="qnu-review-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker></defs><rect width="1280" height="720" fill="#ffffff"/><text x="40" y="70" class="title" text-anchor="start">Hai lần rà soát, hai mục tiêu khác nhau</text><text x="40" y="100" class="subtitle" text-anchor="start">Hậu OCR xử lý chữ; hậu Compiler rà ý nghĩa. Cả hai đều giữ được bằng chứng ban đầu.</text><path class="connector" d="M280 224 H352" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow-link)"/><path class="connector" d="M592 224 H664" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow)"/><path class="connector" d="M904 224 H976" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow)"/><path class="connector" d="M160 280 V336 A8 8 0 0 0 168 344 H776 A8 8 0 0 0 784 336 V280" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow)"/><path class="connector" d="M112 280 V436" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow)"/><path class="connector" d="M1096 280 V400 A8 8 0 0 1 1088 408 H168 A8 8 0 0 0 160 416 V436" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow)" stroke-dasharray="7 5"/><path class="connector" d="M280 492 H352" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow)"/><path class="connector" d="M592 492 H664" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow-link)"/><path class="connector" d="M904 492 H976" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow)"/><g class="edge-label-group"><rect class="label-mask" x="396" y="310" width="180" height="20" fill="#ffffff"/><text x="402" y="324" class="edge-label" text-anchor="start">Hoặc tự sửa trực tiếp</text></g><g class="edge-label-group"><rect class="label-mask" x="124" y="356" width="92" height="20" fill="#ffffff"/><text x="130" y="370" class="edge-label" text-anchor="start">OCR gốc</text></g><g class="edge-label-group"><rect class="label-mask" x="468" y="374" width="280" height="20" fill="#ffffff"/><text x="474" y="388" class="edge-label" text-anchor="start">Chưa nối bản đã sửa vào Compiler</text></g><g class="node" data-node-id="original-ocr" data-x="40" data-y="168" data-w="240" data-h="112"><rect x="40" y="168" width="240" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="192" class="number" text-anchor="start">ĐẦU VÀO</text><text x="56" y="222" class="node-title" text-anchor="start">Văn bản OCR gốc</text><text x="56" y="246" class="node-sub" text-anchor="start">Có trang, đoạn và ô bảng</text><text x="56" y="264" class="node-sub" text-anchor="start">Luôn giữ để đối chiếu</text></g><g class="node" data-node-id="spelling" data-x="352" data-y="168" data-w="240" data-h="112"><rect x="352" y="168" width="240" height="112" rx="8" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1.5"/><text x="368" y="192" class="number" text-anchor="start">GỢI Ý</text><text x="368" y="222" class="node-title" text-anchor="start">Phát hiện chính tả</text><text x="368" y="246" class="node-sub" text-anchor="start">Model đề xuất chỗ nghi sai</text><text x="368" y="264" class="node-sub" text-anchor="start">Kèm nguyên văn và lý do</text></g><g class="node" data-node-id="human-edit" data-x="664" data-y="168" data-w="240" data-h="112"><rect x="664" y="168" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="680" y="192" class="number" text-anchor="start">CHỦ ĐỘNG</text><text x="680" y="222" class="node-title" text-anchor="start">Người dùng sửa</text><text x="680" y="246" class="node-sub" text-anchor="start">Chấp nhận gợi ý hoặc tự nhập</text><text x="680" y="264" class="node-sub" text-anchor="start">Chỉ lưu sau thao tác xác nhận</text></g><g class="node" data-node-id="saved-text" data-x="976" data-y="168" data-w="240" data-h="112"><rect x="976" y="168" width="240" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="992" y="192" class="number" text-anchor="start">BẢN DẪN XUẤT</text><text x="992" y="222" class="node-title" text-anchor="start">Lưu MD/JSON đã sửa</text><text x="992" y="246" class="node-sub" text-anchor="start">Hai tệp từ cùng nội dung</text><text x="992" y="264" class="node-sub" text-anchor="start">Có phiên bản và lịch sử sửa</text></g><g class="node" data-node-id="compiler-input" data-x="40" data-y="436" data-w="240" data-h="112"><rect x="40" y="436" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="460" class="number" text-anchor="start">BIÊN SOẠN</text><text x="56" y="490" class="node-title" text-anchor="start">Compiler</text><text x="56" y="514" class="node-sub" text-anchor="start">Hiện vẫn dùng OCR gốc đã ghim</text><text x="56" y="532" class="node-sub" text-anchor="start">Chưa đọc bản sửa ở hàng trên</text></g><g class="node" data-node-id="draft" data-x="352" data-y="436" data-w="240" data-h="112"><rect x="352" y="436" width="240" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="368" y="460" class="number" text-anchor="start">ĐẦU RA</text><text x="368" y="490" class="node-title" text-anchor="start">Bản nháp MD/JSON</text><text x="368" y="514" class="node-sub" text-anchor="start">Giữ bảng nguồn và trích dẫn</text><text x="368" y="532" class="node-sub" text-anchor="start">Chưa tự duyệt / xuất bản</text></g><g class="node" data-node-id="review" data-x="664" data-y="436" data-w="240" data-h="112"><rect x="664" y="436" width="240" height="112" rx="8" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1.5"/><text x="680" y="460" class="number" text-anchor="start">ĐỐI CHIẾU</text><text x="680" y="490" class="node-title" text-anchor="start">Review ngữ nghĩa</text><text x="680" y="514" class="node-sub" text-anchor="start">Nguồn → nháp: có bỏ sót ý?</text><text x="680" y="532" class="node-sub" text-anchor="start">Nháp → nguồn: có sai / thêm ý?</text></g><g class="node" data-node-id="review-report" data-x="976" data-y="436" data-w="240" data-h="112"><rect x="976" y="436" width="240" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="992" y="460" class="number" text-anchor="start">ĐỂ NGƯỜI DÙNG XEM</text><text x="992" y="490" class="node-title" text-anchor="start">Báo cáo review</text><text x="992" y="514" class="node-sub" text-anchor="start">Đoạn nguồn + đoạn biên soạn</text><text x="992" y="532" class="node-sub" text-anchor="start">Lý do và gợi ý xử lý</text></g><text x="40" y="594" class="body" text-anchor="start">Đã có API sửa/lưu và review; màn hình đọc đoạn, tô lỗi, sửa và lưu sẽ làm sau theo yêu cầu.</text><text x="40" y="614" class="body" text-anchor="start">Review chưa tự sửa bản biên soạn; việc chấp nhận sửa và tạo phiên bản Compiler mới cần luồng bổ sung.</text><text x="40" y="634" class="body" text-anchor="start">Lưu thành công hoặc “chưa phát hiện vấn đề” không đồng nghĩa đã đối chiếu ảnh gốc hay đúng 100%.</text><path d="M40 650 H1240" stroke="#cbd5e1"/><path class="connector" d="M48 677 H88" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow)"/><text x="100" y="681" class="footer" text-anchor="start">Đã có luồng/API backend</text><path class="connector" d="M352 677 H392" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow-link)"/><text x="404" y="681" class="footer" text-anchor="start">Gọi API theo yêu cầu</text><path class="connector" d="M656 677 H696" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-review-arrow)" stroke-dasharray="7 5"/><text x="708" y="681" class="footer" text-anchor="start">Chưa nối — hướng tiếp theo</text><text x="1240" y="681" class="footer" text-anchor="end">QNU · 26/10/2026</text></svg>