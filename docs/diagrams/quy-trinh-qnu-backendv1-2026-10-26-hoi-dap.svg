472 352 V436" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-conversation-arrow)"/><g class="edge-label-group"><rect class="label-mask" x="1154" y="344" width="84" height="20" fill="#ffffff"/><text x="1160" y="358" class="edge-label" text-anchor="start">Có nguồn</text></g><g class="edge-label-group"><rect class="label-mask" x="520" y="310" width="340" height="20" fill="#ffffff"/><text x="526" y="324" class="edge-label" text-anchor="start">Không có đoạn phù hợp → báo thiếu căn cứ</text></g><g class="node" data-node-id="question" data-x="40" data-y="168" data-w="240" data-h="112"><rect x="40" y="168" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="192" class="number" text-anchor="start">BẮT ĐẦU</text><text x="56" y="222" class="node-title" text-anchor="start">Câu hỏi của bạn</text><text x="56" y="246" class="node-sub" text-anchor="start">Gửi trong hội thoại đã mở</text><text x="56" y="264" class="node-sub" text-anchor="start">Lượt hỏi có mã chống gửi trùng</text></g><g class="node" data-node-id="assistant" data-x="352" data-y="168" data-w="240" data-h="112"><rect x="352" y="168" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="368" y="192" class="number" text-anchor="start">NGỮ CẢNH</text><text x="368" y="222" class="node-title" text-anchor="start">Trợ lý và phạm vi</text><text x="368" y="246" class="node-sub" text-anchor="start">Một kho tri thức đã cấu hình</text><text x="368" y="264" class="node-sub" text-anchor="start">Kiểm quyền, chủ hội thoại</text></g><g class="node" data-node-id="rewrite" data-x="664" data-y="168" data-w="240" data-h="112"><rect x="664" y="168" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="680" y="192" class="number" text-anchor="start">KHI CÓ LỊCH SỬ</text><text x="680" y="222" class="node-title" text-anchor="start">Làm rõ câu nối tiếp</text><text x="680" y="246" class="node-sub" text-anchor="start">Dựa vào các câu hỏi trước</text><text x="680" y="264" class="node-sub" text-anchor="start">Giữ chủ thể và phạm vi hỏi</text></g><g class="node" data-node-id="retrieve" data-x="976" data-y="168" data-w="240" data-h="112"><rect x="976" y="168" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="992" y="192" class="number" text-anchor="start">TÌM KIẾM</text><text x="992" y="222" class="node-title" text-anchor="start">Truy xuất bằng chứng</text><text x="992" y="246" class="node-sub" text-anchor="start">Embedding câu hỏi → Qdrant</text><text x="992" y="264" class="node-sub" text-anchor="start">Đúng kho, phiên bản, publication</text></g><g class="node" data-node-id="generation" data-x="976" data-y="436" data-w="240" data-h="112"><rect x="976" y="436" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="992" y="460" class="number" text-anchor="start">TRẢ LỜI</text><text x="992" y="490" class="node-title" text-anchor="start">LLM soạn câu trả lời</text><text x="992" y="514" class="node-sub" text-anchor="start">Chỉ dùng bằng chứng được cấp</text><text x="992" y="532" class="node-sub" text-anchor="start">Model giải quyết qua ModelOps</text></g><g class="node" data-node-id="citations" data-x="664" data-y="436" data-w="240" data-h="112"><rect x="664" y="436" width="240" height="112" rx="8" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1.5"/><text x="680" y="460" class="number" text-anchor="start">ĐỐI SOÁT</text><text x="680" y="490" class="node-title" text-anchor="start">Kiểm nguồn và quyền</text><text x="680" y="514" class="node-sub" text-anchor="start">Kiểm ID trích dẫn / trạng thái</text><text x="680" y="532" class="node-sub" text-anchor="start">Kiểm lại nguồn sau khi sinh</text></g><g class="node" data-node-id="answer" data-x="352" data-y="436" data-w="240" data-h="112"><rect x="352" y="436" width="240" height="112" rx="8" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1.5"/><text x="368" y="460" class="number" text-anchor="start">KẾT QUẢ</text><text x="368" y="490" class="node-title" text-anchor="start">Kết quả trả cho bạn</text><text x="368" y="514" class="node-sub" text-anchor="start">Câu trả lời có nguồn</text><text x="368" y="532" class="node-sub" text-anchor="start">Hoặc báo chưa đủ căn cứ</text></g><g class="node" data-node-id="history" data-x="40" data-y="436" data-w="240" data-h="112"><rect x="40" y="436" width="240" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="460" class="number" text-anchor="start">LỊCH SỬ</text><text x="56" y="490" class="node-title" text-anchor="start">Lưu lượt hội thoại</text><text x="56" y="514" class="node-sub" text-anchor="start">Câu hỏi, kết quả và trích dẫn</text><text x="56" y="532" class="node-sub" text-anchor="start">Lỗi / trạng thái lưu trung thực</text></g><text x="40" y="594" class="body" text-anchor="start">ModelOps quản lý model, credential được bảo vệ, quyền sử dụng, ngân sách và usage cho các lượt gọi AI.</text><text x="40" y="614" class="body" text-anchor="start">Lịch sử câu hỏi giúp làm rõ tham chiếu; câu trả lời cũ không được dùng thay bằng chứng nguồn.</text><text x="40" y="634" class="body" text-anchor="start">Provider hoặc hạ tầng lỗi phải báo lỗi; không biến thành “không có dữ liệu”. Hybrid và reranker chưa nối.</text><path d="M40 650 H1240" stroke="#cbd5e1"/><path class="connector" d="M48 677 H88" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-conversation-arrow)"/><text x="100" y="681" class="footer" text-anchor="start">Đã có luồng/API backend</text><path class="connector" d="M352 677 H392" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-conversation-arrow-link)"/><text x="404" y="681" class="footer" text-anchor="start">Gọi API theo yêu cầu</text><text x="1240" y="681" class="footer" text-anchor="end">QNU · 26/10/2026</text></svg>