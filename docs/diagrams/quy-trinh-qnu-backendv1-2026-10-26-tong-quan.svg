<svg xmlns="http://www.w3.org/2000/svg" id="qnu-overview" viewBox="0 0 1280 720" role="img" aria-labelledby="qnu-overview-title qnu-overview-desc"><title id="qnu-overview-title">Từ tài liệu đến câu trả lời có nguồn</title><desc id="qnu-overview-desc">Luồng backend hiện có. Các bước duyệt, xuất bản và lập chỉ mục được gọi riêng qua API.</desc><defs><style>
text { font-family: 'Geist', 'Segoe UI', Arial, sans-serif; fill:#0f172a; }
.title { font-family:'Instrument Serif','Noto Serif',Georgia,serif; font-size:40px; font-weight:400; }
.subtitle,.body { font-size:12px; fill:#475569; }
.node-title { font-size:16px; font-weight:600; }
.node-sub { font-size:12px; fill:#475569; }
.number { font-size:11px; font-weight:400; fill:#64748b; }
.section { font-size:14px; font-weight:600; }
.edge-label { font-size:12px; fill:#475569; }
.footer { font-size:11px; fill:#64748b; }
.pill { font-size:11px; fill:#0f766e; }
</style><marker id="qnu-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker><marker id="qnu-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0284c7"/></marker><marker id="qnu-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker></defs><rect width="1280" height="720" fill="#ffffff"/><text x="40" y="70" class="title" text-anchor="start">Từ tài liệu đến câu trả lời có nguồn</text><text x="40" y="100" class="subtitle" text-anchor="start">Luồng backend hiện có. Các bước duyệt, xuất bản và lập chỉ mục được gọi riêng qua API.</text><path class="connector" d="M280 224 H352" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-overview-arrow)"/><path class="connector" d="M592 224 H664" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-overview-arrow)"/><path class="connector" d="M904 224 H976" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-overview-arrow)"/><path class="connector" d="M1048 280 V336 A8 8 0 0 1 1040 344 H792 A8 8 0 0 0 784 352 V436" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-overview-arrow)"/><path class="connector" d="M1144 280 V436" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-overview-arrow-link)"/><path class="connector" d="M664 492 H592" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-overview-arrow)"/><path class="connector" d="M352 492 H280" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-overview-arrow)"/><g class="edge-label-group"><rect class="label-mask" x="828" y="310" width="172" height="20" fill="#ffffff"/><text x="834" y="324" class="edge-label" text-anchor="start">Đăng ký bản nháp</text></g><g class="edge-label-group"><rect class="label-mask" x="1154" y="344" width="80" height="20" fill="#ffffff"/><text x="1160" y="358" class="edge-label" text-anchor="start">Review</text></g><g class="node" data-node-id="upload" data-x="40" data-y="168" data-w="240" data-h="112"><rect x="40" y="168" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="192" class="number" text-anchor="start">TIẾP NHẬN</text><text x="56" y="222" class="node-title" text-anchor="start">1. Upload tài liệu</text><text x="56" y="246" class="node-sub" text-anchor="start">PDF/DOCX vào kho tri thức</text><text x="56" y="264" class="node-sub" text-anchor="start">Lưu revision gốc và hash</text></g><g class="node" data-node-id="ocr" data-x="352" data-y="168" data-w="240" data-h="112"><rect x="352" y="168" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="368" y="192" class="number" text-anchor="start">TRÍCH XUẤT</text><text x="368" y="222" class="node-title" text-anchor="start">2. Render và OCR</text><text x="368" y="246" class="node-sub" text-anchor="start">Job bền vững · ảnh từng trang</text><text x="368" y="264" class="node-sub" text-anchor="start">Nemotron qua ModelOps</text></g><g class="node" data-node-id="ocr-results" data-x="664" data-y="168" data-w="240" data-h="112"><rect x="664" y="168" width="240" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="680" y="192" class="number" text-anchor="start">BẰNG CHỨNG</text><text x="680" y="222" class="node-title" text-anchor="start">3. Lưu kết quả OCR</text><text x="680" y="246" class="node-sub" text-anchor="start">Raw nguyên bản + Markdown/JSON</text><text x="680" y="264" class="node-sub" text-anchor="start">Giữ bảng, trang, vị trí nguồn</text></g><g class="node" data-node-id="compiler" data-x="976" data-y="168" data-w="240" data-h="112"><rect x="976" y="168" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="992" y="192" class="number" text-anchor="start">BIÊN SOẠN</text><text x="992" y="222" class="node-title" text-anchor="start">4. Compiler</text><text x="992" y="246" class="node-sub" text-anchor="start">LLM biên soạn bản nháp</text><text x="992" y="264" class="node-sub" text-anchor="start">Ghim nguồn, giữ bảng, dẫn nguồn</text></g><g class="node" data-node-id="semantic-review" data-x="976" data-y="436" data-w="240" data-h="112"><rect x="976" y="436" width="240" height="112" rx="8" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1.5"/><text x="992" y="460" class="number" text-anchor="start">RÀ SOÁT</text><text x="992" y="490" class="node-title" text-anchor="start">Review sau Compiler</text><text x="992" y="514" class="node-sub" text-anchor="start">Tìm bỏ sót / sai diễn giải</text><text x="992" y="532" class="node-sub" text-anchor="start">Báo cáo riêng, gọi qua API</text></g><g class="node" data-node-id="publication" data-x="664" data-y="436" data-w="240" data-h="112"><rect x="664" y="436" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="680" y="460" class="number" text-anchor="start">QUYẾT ĐỊNH</text><text x="680" y="490" class="node-title" text-anchor="start">5. Duyệt và xuất bản</text><text x="680" y="514" class="node-sub" text-anchor="start">Đăng ký phiên bản · preview</text><text x="680" y="532" class="node-sub" text-anchor="start">Người có quyền duyệt / publish</text></g><g class="node" data-node-id="index" data-x="352" data-y="436" data-w="240" data-h="112"><rect x="352" y="436" width="240" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="368" y="460" class="number" text-anchor="start">CHUẨN BỊ TÌM KIẾM</text><text x="368" y="490" class="node-title" text-anchor="start">6. Lập chỉ mục</text><text x="368" y="514" class="node-sub" text-anchor="start">Chia đoạn + embedding</text><text x="368" y="532" class="node-sub" text-anchor="start">Qdrant · chỉ nguồn đã xuất bản</text></g><g class="node" data-node-id="chat" data-x="40" data-y="436" data-w="240" data-h="112"><rect x="40" y="436" width="240" height="112" rx="8" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1.5"/><text x="56" y="460" class="number" text-anchor="start">SỬ DỤNG</text><text x="56" y="490" class="node-title" text-anchor="start">7. Hỏi đáp có nguồn</text><text x="56" y="514" class="node-sub" text-anchor="start">Truy xuất → LLM → kiểm trích dẫn</text><text x="56" y="532" class="node-sub" text-anchor="start">Lưu hội thoại và lượt hỏi</text></g><text x="40" y="594" class="body" text-anchor="start">Nhánh sửa chính tả hậu OCR được tách ở sơ đồ 02; bản đã sửa hiện chưa nối vào Compiler.</text><text x="40" y="614" class="body" text-anchor="start">Review là báo cáo để đối chiếu; chưa tự chạy trong worker và chưa là điều kiện bắt buộc để publish.</text><text x="40" y="634" class="body" text-anchor="start">Trạng thái: đã có mã/API và kiểm thử chức năng; chưa migrate/deploy DB phục vụ hoặc nghiệm thu chất lượng toàn luồng.</text><path d="M40 650 H1240" stroke="#cbd5e1"/><path class="connector" d="M48 677 H88" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-overview-arrow)"/><text x="100" y="681" class="footer" text-anchor="start">Đã có luồng/API backend</text><path class="connector" d="M352 677 H392" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#qnu-overview-arrow-link)"/><text x="404" y="681" class="footer" text-anchor="start">Gọi API theo yêu cầu</text><text x="1240" y="681" class="footer" text-anchor="end">QNU · 26/10/2026</text></svg>