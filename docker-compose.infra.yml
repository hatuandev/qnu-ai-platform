# ==============================================================================
# QNU.AI Platform — Local Infrastructure Stack (PostgreSQL, Qdrant, Redis, MinIO, Gotenberg)
# Use: docker compose -f docker-compose.infra.yml up -d
# ==============================================================================

services:
  postgres:
    image: postgres:16
    container_name: qnu_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qnu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qnu_password_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-qnu_ai_platform}
    volumes:
      - qnu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qnu}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qnu_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qnu_qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qnu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - qnu_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: qnu_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-qnu_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-qnu_minio_secret_2026}
    command: server /data --console-address ":9001"
    volumes:
      - qnu_minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: qnu_gotenberg
    restart: unless-stopped
    ports:
      - "3005:3000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qnu_postgres_data:
    name: qnu_postgres_data
  qnu_qdrant_data:
    name: qnu_qdrant_data
  qnu_redis_data:
    name: qnu_redis_data
  qnu_minio_data:
    name: qnu_minio_data
