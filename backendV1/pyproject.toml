[project]
name = "qnu-backend-v1"
version = "0.1.0"
description = "QNU AI Platform - backend v1 (modular monolith, evidence-first RAG)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
    "cryptography>=50.0.1",
    "boto3>=1.34.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.18",
    "pymupdf>=1.24,<2",
    "docling-slim[format-docx]==2.145.0",
    "pdf-inspector==1.25.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qnu"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "LOG014", "RUF012", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:pydantic.*"]
markers = [
    "stage1: Stage 1 workspace management",
    "stage2: Stage 2 knowledge and documents",
    "stage3: Stage 3 assistant lifecycle",
    "stage4: Stage 4 RAG QA and truthfulness",
    "stage5: Stage 5 feedback and benchmark bridge",
    "stage6: Stage 6 publication and OpenAI gateway",
    "stage7: Stage 7 cleanup and residual audit",
    "e2e_full: Full end-to-end pipeline run from A to Z",
]
