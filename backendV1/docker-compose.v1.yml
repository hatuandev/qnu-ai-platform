# backendV1 runs beside the legacy backend on the same Postgres.
# It owns its queue, cache namespace and port; it never consumes legacy jobs.
services:
  api-v1:
    build: .
    command: ["uvicorn", "qnu.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8002:8001"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_PREFIX: ${API_PREFIX:-/platform/v1alpha1}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      QUEUE_NAME: ${QUEUE_NAME:-qnu:v1:jobs}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-qnu:v1:cache:}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    restart: unless-stopped

  worker-v1:
    build: .
    command: ["arq", "qnu.workers.settings.WorkerSettings"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      QUEUE_NAME: ${QUEUE_NAME:-qnu:v1:jobs}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-qnu:v1:cache:}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    restart: unless-stopped
    depends_on:
      - api-v1
