# Bảng nào do ai quản lý DDL. backendV1 chỉ sở hữu các bảng liệt kê ở v1_owned.
version: 1
database: qnu_ai_platform
legacy:
  version_table: alembic_version
  owner: backend
  status: serving
v1:
  version_table: alembic_version_backendv1
  owner: backendV1
  status: parallel
  initial_revision: 0001_initial_schema
v1_owned:
  # Batch 2026-10-27 — approved orphan derivative cleanup
  - ops_storage_cleanup_actions
  # Batch 2026-10-26 — workspaces
  - workspaces
  - workspace_members
  - workspace_events
  # Batch 2026-10-26 — modelops
  - providers
  - provider_keys
  - provider_key_audits
  - model_defaults
  - workspace_allowed_providers
# Thêm tên bảng vào v1_owned khi một migration của backendV1 tạo bảng mới.
# Không bảng nào trong danh sách legacy được v1 sửa DDL.
  - workspace_model_defaults
  - workspace_quotas
  - model_usage_records
  - modelops_events
  # Batch 2026-10-26 — knowledge: collection, nguồn, phiên bản file, idempotency
  - kb_collections
  - kb_sources
  - kb_source_revisions
  - kb_upload_requests
  # Batch 2026-10-26 — OCR processing: run ghim revision, trạng thái trang, artifact
  - ocr_processing_runs
  - ocr_run_pages
  - ocr_run_artifacts
  # Batch 2026-10-26 — Compiler drafts and pinned OCR input bindings
  - kb_compilation_runs
  - kb_compilation_inputs
  - kb_compilation_artifacts
  # Batch 2026-10-26 — document versions and explicit publication decisions
  - kb_compiled_documents
  - kb_compiled_versions
  - kb_publication_previews
  - kb_publication_decisions
  # Batch 2026-10-26 — isolated dense generations and publication-bound chunks
  - kb_index_runs
  - kb_index_sync
  - kb_index_inputs
  - kb_index_chunks
  # Batch 2026-10-26 — assistants and owned persistent conversations
  - chat_assistants
  - chat_conversations
  - chat_turns
  # Batch 2026-10-26 — saved OCR text revisions and spelling inspections
  - ocr_text_versions
  - ocr_spelling_runs
  # Batch 2026-10-26 — compiler semantic review, separate from approval
  - kb_compilation_reviews
  - kb_compilation_review_artifacts
  - kb_compilation_review_jobs
  - kb_compilation_edit_previews
  - ops_actions
  - ops_evidence_backups
  - resource_lifecycle_states
  - resource_lifecycle_actions
