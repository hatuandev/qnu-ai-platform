# QNU V1 application stack. Infrastructure remains external and retains its data.
# The frontendV2 container is prepared but gated behind the "frontend" profile
# until production SSO exists; the public chatbot pages work without SSO.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-runtime: &runtime
  ENVIRONMENT: ${ENVIRONMENT:-production}
  SERVICE_NAME: qnu-backend-v1
  API_PREFIX: /platform/v1alpha1
  PORT: "8002"
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
  QUEUE_NAME: ${V1_QUEUE_NAME:-qnu:v1:jobs}
  CACHE_NAMESPACE: ${V1_CACHE_NAMESPACE:-qnu:v1:cache:}
  QDRANT_URL: ${QDRANT_URL:?Set QDRANT_URL}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  LOCAL_STORAGE_PATH: /app/storage
  S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-qnu-ai-documents}
  S3_SECURE: ${S3_SECURE:-false}
  GOTENBERG_URL: ${GOTENBERG_URL:?Set GOTENBERG_URL}
  DOCX_CONVERTER: ${DOCX_CONVERTER:-gotenberg-libreoffice}
  DOCX_RENDERER_REVISION: ${DOCX_RENDERER_REVISION:-qnu-docx/v2}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:?Keep the existing provider encryption key}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
  DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
  SSO_ENABLED: ${SSO_ENABLED:-true}
  SSO_AUTHORITY: ${SSO_AUTHORITY:?Set SSO_AUTHORITY}
  SSO_AUDIENCE: ${SSO_AUDIENCE:-ai_api}
  SSO_JWKS_URL: ${SSO_JWKS_URL:-}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set comma-separated ALLOWED_ORIGINS}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set browser-visible PUBLIC_BASE_URL}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  COMPILER_SEGMENT_CONCURRENCY: ${COMPILER_SEGMENT_CONCURRENCY:-2}
  MODEL_CHAT_CONCURRENCY: ${MODEL_CHAT_CONCURRENCY:-4}
  OCR_MAX_PAGES: ${OCR_MAX_PAGES:-300}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-62914560}
  WORKER_MODEL_JOB_TIMEOUT_SECONDS: ${WORKER_MODEL_JOB_TIMEOUT_SECONDS:-86400}
  OWN_RECONCILE: ${OWN_RECONCILE:-true}
  # Env-only kill-switch for /public/chatbots/*; must be passed into the container.
  PUBLIC_CHATBOTS_ENABLED: ${PUBLIC_CHATBOTS_ENABLED:-true}

x-api: &api
  image: qnu-ai-platform-v1:${APP_IMAGE_TAG:-latest}
  build:
    context: ./backendV1
    dockerfile: Dockerfile
  networks: [dokploy-network]
  extra_hosts: ["host.docker.internal:host-gateway"]
  environment: *runtime
  volumes: [qnu_storage:/app/storage]
  logging: *logging
  init: true

services:
  # A fresh object store has no bucket; create it before migrations and uploads.
  storage-init:
    <<: *api
    command: ["python", "-m", "qnu.platform.storage_init"]
    restart: "on-failure:5"
    healthcheck:
      disable: true
  bootstrap:
    <<: *api
    # Create database if missing and apply V1 migration chain.
    command: ["sh", "-c", "python -m qnu.platform.database_init && alembic upgrade head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      storage-init:
        condition: service_completed_successfully
  backend:
    <<: *api
    command: ["uvicorn", "qnu.main:app", "--host", "0.0.0.0", "--port", "8002", "--proxy-headers"]
    environment:
      <<: *runtime
      # Configure the actual proxy IPs or a dedicated proxy subnet in Dokploy.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
    restart: unless-stopped
    stop_grace_period: 30s
    expose: ["8002"]
    # Readiness also checks PostgreSQL and Redis; liveness alone can hide a broken app.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      bootstrap:
        condition: service_completed_successfully
  frontend:
    image: qnu-ai-platform-frontend-v2:${APP_IMAGE_TAG:-latest}
    build:
      context: ./frontendV2
      dockerfile: Dockerfile
    networks: [dokploy-network]
    expose: ["80"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
  worker:
    <<: *api
    command: ["arq", "qnu.workers.settings.WorkerSettings"]
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "arq", "--check", "qnu.workers.settings.WorkerSettings"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

networks:
  dokploy-network:
    external: true
volumes:
  qnu_storage:
    name: qnu_platform_storage
