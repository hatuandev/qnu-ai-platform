# ==============================================================================
# QNU.AI Platform — Dokploy Production Application Stack
# Gồm 3 dịch vụ cốt lõi: Backend API, Async Worker (ARQ), Frontend Web UI
# Kết nối trực tiếp tới hạ tầng CSDL bên ngoài qua các biến môi trường (.env)
# ==============================================================================

networks:
  qnu_network:
    name: qnu_network
    driver: bridge

services:

  # ----------------------------------------------------------------------------
  # 1. Backend Core API (FastAPI) — Tự động Migration & Auto-seed dữ liệu
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: qnu_platform_backend:latest
    container_name: qnu_backend
    restart: unless-stopped
    networks:
      - qnu_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8001"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=8001
      - WORKERS=${BACKEND_WORKERS:-4}
      - AUTO_SEED=${AUTO_SEED:-true}
      - DATABASE_URL=${DATABASE_URL:-${CONNECTION_STRING:-postgresql+asyncpg://${POSTGRES_USER:-qnu}:${POSTGRES_PASSWORD:-qnu_password_secure_2026}@postgres:5432/${POSTGRES_DB:-qnu_ai_platform}}}
      - CONNECTION_STRING=${CONNECTION_STRING:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-qnu_knowledge_chunks}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-s3}
      - S3_ENDPOINT=${S3_ENDPOINT:-${FILE_STORAGE_ENDPOINT:-http://minio:9000}}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-${FILE_STORAGE_ACCESS_KEY:-qnu_minio_admin}}}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-${FILE_STORAGE_SECRET_KEY:-qnu_minio_secret_2026}}}
      - S3_BUCKET=${S3_BUCKET:-${FILE_STORAGE_BUCKET:-qnu-ai-documents}}
      - S3_SECURE=${S3_SECURE:-${FILE_STORAGE_USE_SSL:-false}}
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg:3000}
      - GOTENBERG_USERNAME=${GOTENBERG_USERNAME:-}
      - GOTENBERG_PASSWORD=${GOTENBERG_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-2.5-flash-lite}
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - SECRET_KEY=${SECRET_KEY:-8f4a1c6e9d2b7f3a5e8c1b4d7f0a3c6e9b2d5f8a1c4e7b0d3f6a9c2e5b8d1f4a}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-qnu_internal_secure_token_prod_2026}
      - DEV_AUTH_ENABLED=${DEV_AUTH_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["*"]}
    volumes:
      - ./configs:/app/configs:ro
      - qnu_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Async Background Task Worker (ARQ + Redis) — Bóc tách, OCR, Reindex
  # ----------------------------------------------------------------------------
  worker:
    image: qnu_platform_backend:latest
    container_name: qnu_worker
    restart: unless-stopped
    command: ["arq", "app.workers.arq_worker.WorkerSettings"]
    networks:
      - qnu_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AUTO_SEED=false
      - DATABASE_URL=${DATABASE_URL:-${CONNECTION_STRING:-postgresql+asyncpg://${POSTGRES_USER:-qnu}:${POSTGRES_PASSWORD:-qnu_password_secure_2026}@postgres:5432/${POSTGRES_DB:-qnu_ai_platform}}}
      - CONNECTION_STRING=${CONNECTION_STRING:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-s3}
      - S3_ENDPOINT=${S3_ENDPOINT:-${FILE_STORAGE_ENDPOINT:-http://minio:9000}}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-${FILE_STORAGE_ACCESS_KEY:-qnu_minio_admin}}}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-${FILE_STORAGE_SECRET_KEY:-qnu_minio_secret_2026}}}
      - S3_BUCKET=${S3_BUCKET:-${FILE_STORAGE_BUCKET:-qnu-ai-documents}}
      - S3_SECURE=${S3_SECURE:-${FILE_STORAGE_USE_SSL:-false}}
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg:3000}
      - GOTENBERG_USERNAME=${GOTENBERG_USERNAME:-}
      - GOTENBERG_PASSWORD=${GOTENBERG_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-8f4a1c6e9d2b7f3a5e8c1b4d7f0a3c6e9b2d5f8a1c4e7b0d3f6a9c2e5b8d1f4a}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-qnu_internal_secure_token_prod_2026}
    volumes:
      - ./configs:/app/configs:ro
      - qnu_storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. Frontend Web Application (React 19 + Vite + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend2
      dockerfile: Dockerfile
    container_name: qnu_frontend
    restart: unless-stopped
    networks:
      - qnu_network
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qnu_storage:
    name: qnu_platform_storage
