# ==============================================================================
# QNU.AI Platform — Production Docker Compose Stack
# Architecture: High-Availability, Resilient Backend, Async Workers & Microservices
#
# Khởi chạy toàn bộ hệ thống:
#   docker compose up -d --build
#
# Kiểm tra trạng thái các container:
#   docker compose ps
# ==============================================================================

networks:
  qnu_network:
    name: qnu_network
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 — Relational Database, Knowledge Facts & Vietnamese FTS
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: qnu_postgres
    restart: unless-stopped
    networks:
      - qnu_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qnu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qnu_password_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-qnu_ai_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qnu} -d ${POSTGRES_DB:-qnu_ai_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Qdrant — High-Performance Vector Database (BGE-M3 1024-dim Embeddings)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qnu_qdrant
    restart: unless-stopped
    networks:
      - qnu_network
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Redis — Semantic Cache & ARQ Async Job Queue Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: qnu_redis
    restart: unless-stopped
    networks:
      - qnu_network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. MinIO — S3-Compatible Object Storage (Raw PDFs, OCR & Scanned Archives)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: qnu_minio
    restart: unless-stopped
    networks:
      - qnu_network
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-qnu_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-qnu_minio_secret_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 5. Gotenberg 8 — Headless LibreOffice / Chromium PDF Converter (Nghị định 30)
  # ----------------------------------------------------------------------------
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: qnu_gotenberg
    restart: unless-stopped
    networks:
      - qnu_network
    ports:
      - "3005:3000"

  # ----------------------------------------------------------------------------
  # 6. QNU.AI Platform Core API — FastAPI Application Service (Port 8001)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qnu_backend
    restart: unless-stopped
    networks:
      - qnu_network
    ports:
      - "${PORT:-8001}:8001"
    environment:
      - ENVIRONMENT=production
      - SERVICE_NAME=qnu-ai-platform
      - API_PREFIX=/platform/v1alpha1
      - PORT=8001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-qnu}:${POSTGRES_PASSWORD:-qnu_password_secure_2026}@postgres:5432/${POSTGRES_DB:-qnu_ai_platform}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-qnu_knowledge_chunks}
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DRIVER=${STORAGE_DRIVER:-s3}
      - LOCAL_STORAGE_PATH=/app/storage
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-qnu_minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-qnu_minio_secret_2026}
      - S3_BUCKET=${S3_BUCKET:-qnu-ai-documents}
      - S3_SECURE=false
      - GOTENBERG_URL=http://gotenberg:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-qnu-ai-platform-super-secret-key-change-in-production-2026}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-qnu_internal_secret_key_2026}
      - DEV_AUTH_ENABLED=${DEV_AUTH_ENABLED:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:3000","https://ai.qnu.edu.vn"]}
      - JSON_LOGGING=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_PROMETHEUS=true
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 7. QNU.AI Async Background Worker — ARQ Engine for Ingestion & Long Jobs
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qnu_worker
    restart: unless-stopped
    networks:
      - qnu_network
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    environment:
      - ENVIRONMENT=production
      - SERVICE_NAME=qnu-ai-platform-worker
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-qnu}:${POSTGRES_PASSWORD:-qnu_password_secure_2026}@postgres:5432/${POSTGRES_DB:-qnu_ai_platform}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DRIVER=${STORAGE_DRIVER:-s3}
      - LOCAL_STORAGE_PATH=/app/storage
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-qnu_minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-qnu_minio_secret_2026}
      - S3_BUCKET=${S3_BUCKET:-qnu-ai-documents}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JSON_LOGGING=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - backend_storage:/app/storage
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
    name: qnu_postgres_data
  qdrant_data:
    name: qnu_qdrant_data
  redis_data:
    name: qnu_redis_data
  minio_data:
    name: qnu_minio_data
  backend_storage:
    name: qnu_backend_storage
