# ==============================================================================
# QNU.AI Platform — Local Infrastructure Stack (Docker Compose)
# Dành cho môi trường phát triển cục bộ: Postgres, Qdrant, Redis, MinIO, Gotenberg
#
# Khởi chạy toàn bộ cụm hạ tầng nền:
#   docker compose up -d
#
# Kiểm tra trạng thái các container:
#   docker compose ps
#
# Tắt cụm hạ tầng (giữ nguyên dữ liệu volume):
#   docker compose down
#
# Xóa sạch dữ liệu volumes:
#   docker compose down -v
# ==============================================================================

networks:
  qnu_network:
    name: qnu_network
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 — Relational Database, Knowledge Facts & Vietnamese FTS
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: qnu_postgres
    restart: unless-stopped
    networks:
      - qnu_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qnu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qnu_password_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-qnu_ai_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qnu} -d ${POSTGRES_DB:-qnu_ai_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Qdrant — High-Performance Vector Database (BGE-M3 1024-dim Embeddings)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qnu_qdrant
    restart: unless-stopped
    networks:
      - qnu_network
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Redis — Semantic Cache & ARQ Async Job Queue Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: qnu_redis
    restart: unless-stopped
    networks:
      - qnu_network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. MinIO — S3-Compatible Object Storage (Raw PDFs, OCR & Scanned Archives)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: qnu_minio
    restart: unless-stopped
    networks:
      - qnu_network
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-qnu_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-qnu_minio_secret_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 5. Gotenberg 8 — Headless LibreOffice / Chromium PDF Converter (Nghị định 30)
  # ----------------------------------------------------------------------------
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: qnu_gotenberg
    restart: unless-stopped
    networks:
      - qnu_network
    ports:
      - "3005:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: qnu_postgres_data
  qdrant_data:
    name: qnu_qdrant_data
  redis_data:
    name: qnu_redis_data
  minio_data:
    name: qnu_minio_data
