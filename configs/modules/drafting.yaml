drafting:
  enabled: true
  # P11-19: when true, ``/v1/drafting/confirm`` records a pending
  # approval and returns 202 instead of writing the DOCX. Admin must
  # approve via ``/v1/drafting/approvals/{id}/approve`` before the
  # artifact is built. Default false so the existing MVP flow keeps
  # working without a config change.
  approval_required: false
  supported_document_types:
    - cong_van
    - quyet_dinh
    - to_trinh
    - thong_bao
    - ke_hoach
    - bao_cao
    - bien_ban
    - giay_moi
    - du_an
    - ban_ghi_nho
    - nghi_quyet
    - chi_thi
  default_output_format: draft_document
  templates_dir: templates/drafting
  templates:
    cong_van: templates/drafting/cong_van.docx
    quyet_dinh: templates/drafting/quyet_dinh.docx
    to_trinh: templates/drafting/to_trinh.docx
    giay_moi: templates/drafting/giay_moi.docx
    thong_bao: templates/drafting/thong_bao.docx  # TODO template file chưa có
    ke_hoach: templates/drafting/ke_hoach.docx  # TODO template file chưa có
    bao_cao: templates/drafting/bao_cao.docx  # TODO template file chưa có
    bien_ban: templates/drafting/bien_ban.docx  # TODO template file chưa có
    du_an: templates/drafting/du_an.docx  # TODO template file chưa có
    ban_ghi_nho: templates/drafting/ban_ghi_nho.docx  # TODO template file chưa có
    nghi_quyet: templates/drafting/nghi_quyet.docx  # TODO template file chưa có
    chi_thi: templates/drafting/chi_thi.docx  # TODO template file chưa có
  # Slot → Jinja placeholder name. Templates follow the QNU drafting
  # convention by default; designers override per template when needed.
  slot_bindings:
    title: TITLE
    document_type: DOC_TYPE
    signer: SIGNER_NAME
    signer_position: SIGNER_POSITION
    recipients: RECIPIENTS
    recipient: RECIPIENT
    date: EFFECTIVE_DATE
    purpose: PURPOSE
    document_number: DOC_NUMBER
    issuer: ISSUER
    subject: SUBJECT
    proposal: PROPOSAL
    timeframe: TIMEFRAME
    period: PERIOD
    legal_basis: LEGAL_BASIS
    attachment: ATTACHMENT
    meeting_title: MEETING_TITLE
    meeting_time: MEETING_TIME
    meeting_place: MEETING_PLACE
    attendees: ATTENDEES
    content: CONTENT
    signers: SIGNERS
    owner: OWNER
    budget: BUDGET
    resolution_content: RESOLUTION_CONTENT
    directive_content: DIRECTIVE_CONTENT
    implementer: IMPLEMENTER
    deadline: DEADLINE
    cc_list: CC_LIST
    effective_scope: EFFECTIVE_SCOPE
    metrics: METRICS
    findings: FINDINGS
    recommendations: RECOMMENDATIONS
    references: REFERENCES
  ask_clarification_when_missing:
    - signer
    - recipient
    - date
    - purpose
  document_number_policy:
    # Regex khớp ``123/CV-ĐHQN`` / ``456/QĐ-ĐHQN``. Default ở
    # ``document_number_guard._DEFAULT_VN_ADMIN_REGEX``; chỉ override khi
    # đơn vị dùng format riêng.
    regex: "^[0-9]{1,5}\\s*[/\\\\-]\\s*[A-ZĐ]{2,8}(?:\\s*[-/]\\s*[A-ZĐ0-9]{2,10})?$"
    require_fact_match: false
  # Per-document-type slot schemas. Planner reads these to decide which
  # required slots to ask for and which optional slots to forward into
  # the composer. Unknown ``document_type`` falls back to ``default``.
  slot_schemas:
    default:
      required:
        - signer
        - recipient
        - date
        - purpose
      optional:
        - issuer
        - references
    cong_van:
      required:
        - signer
        - recipient
        - date
        - purpose
        - document_number
      optional:
        - issuer
        - legal_basis
        - cc_list
        - attachment
    quyet_dinh:
      required:
        - signer
        - document_number
        - date
        - subject
      optional:
        - issuer
        - legal_basis
        - implementer
        - deadline
    to_trinh:
      required:
        - signer
        - recipient
        - date
        - purpose
        - proposal
      optional:
        - issuer
        - legal_basis
        - deadline
    thong_bao:
      required:
        - signer
        - document_number
        - date
        - subject
      optional:
        - issuer
        - effective_scope
        - attachment
    ke_hoach:
      required:
        - signer
        - document_number
        - date
        - subject
        - timeframe
      optional:
        - issuer
        - owner
        - budget
        - attachment
    bao_cao:
      required:
        - signer
        - period
        - subject
      optional:
        - issuer
        - metrics
        - findings
        - recommendations
    bien_ban:
      required:
        - meeting_title
        - meeting_time
        - meeting_place
        - attendees
        - content
        - signers
      optional:
        - attachment
    giay_moi:
      required:
        - signer
        - recipient
        - date
        - meeting_time
        - meeting_place
        - subject
      optional:
        - issuer
        - attachment
    du_an:
      required:
        - signer
        - document_number
        - date
        - subject
        - timeframe
      optional:
        - issuer
        - owner
        - budget
        - legal_basis
        - attachment
    ban_ghi_nho:
      required:
        - signer
        - date
        - subject
        - content
      optional:
        - attendees
        - issuer
        - attachment
    nghi_quyet:
      required:
        - signer
        - document_number
        - date
        - subject
        - resolution_content
      optional:
        - issuer
        - legal_basis
        - implementer
    chi_thi:
      required:
        - signer
        - document_number
        - date
        - subject
        - directive_content
      optional:
        - issuer
        - deadline

